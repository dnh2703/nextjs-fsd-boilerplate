pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css,md,yml,yaml}"
      exclude: "docs/**"
      run: ./node_modules/.bin/oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,cjs,ts,tsx}"
      exclude: "scripts/lint-fixtures/**"
      run: ./node_modules/.bin/oxlint {staged_files}
    fsd:
      glob: "src/**/*"
      run: bun run lint:fsd

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
